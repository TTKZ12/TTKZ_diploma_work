services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ttkz
      POSTGRES_USER: ttkz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttkz_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttkz -d ttkz"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ttkz:${POSTGRES_PASSWORD:-ttkz_dev}@db:5432/ttkz
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: "false"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
